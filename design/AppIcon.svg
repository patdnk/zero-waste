<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#B23A22"/>
      <stop offset="0.55" stop-color="#C2611A"/>
      <stop offset="1" stop-color="#E0B33A"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#D9573B"/>
      <stop offset="1" stop-color="#F2C84B"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#FFFBF7"/>

  <!-- rim (back half, behind the flames) -->
  <path fill="none" stroke="#B23A22" stroke-width="24" d="M 208 640 A 252 50 0 0 1 712 640"/>

  <!-- outer flame -->
  <path fill="url(#flame)" d="
    M 345 655
    C 300 580, 315 505, 375 460
    C 365 515, 392 545, 412 520
    C 435 480, 395 425, 455 330
    C 460 405, 495 430, 505 385
    C 520 320, 480 270, 525 185
    C 565 265, 605 330, 588 425
    C 583 462, 612 470, 628 440
    C 668 500, 645 560, 665 548
    C 695 528, 712 565, 696 605
    C 686 650, 640 660, 590 657 Z"/>

  <!-- inner flame -->
  <path fill="url(#flameInner)" d="
    M 400 652
    C 360 590, 375 530, 425 495
    C 422 540, 448 555, 462 535
    C 480 500, 455 455, 505 380
    C 515 440, 548 460, 552 425
    C 560 380, 545 350, 560 320
    C 590 380, 612 440, 600 495
    C 596 525, 622 535, 636 515
    C 660 570, 640 645, 560 654 Z"/>

  <!-- rim (front half, in front of the flames) -->
  <path fill="none" stroke="#B23A22" stroke-width="24" stroke-linecap="round" d="M 208 640 A 252 50 0 0 0 712 640"/>

  <!-- bowl -->
  <path fill="#2B1A12" d="
    M 213 672
    A 252 50 0 0 0 707 672
    A 250 125 0 0 1 213 672 Z"/>

  <!-- handle -->
  <path fill="none" stroke="#2B1A12" stroke-width="58" stroke-linecap="round"
        d="M 690 668 C 760 650, 830 570, 905 480"/>
  <!-- light gap between bowl and handle, like the reference -->
  <path fill="none" stroke="#FFFBF7" stroke-width="10" stroke-linecap="round"
        d="M 712 616 C 730 640, 736 662, 730 690"/>
</svg>
