name: ZeroBite
options:
  bundleIdPrefix: com.mazesys
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: NU6K42S2Q4
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  ZeroBite:
    type: application
    platform: iOS
    sources:
      - path: ZeroBite
    info:
      path: ZeroBite/Info.plist
      properties:
        CFBundleDisplayName: Zero Bite
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Zero Bite uses the camera to read best-before dates and barcodes on food labels.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazesys.zerobite
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
  ZeroBiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ZeroBiteTests
    dependencies:
      - target: ZeroBite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazesys.zerobite.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ZeroBite:
    build:
      targets:
        ZeroBite: all
        ZeroBiteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ZeroBiteTests
